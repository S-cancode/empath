name: CI

on:
  push:
    branches: [main, app-store-readiness]
  pull_request:

jobs:
  backend:
    name: Backend build + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Production dependency audit (informational until Phase 1 completes)
        run: npm audit --omit=dev || true

  client:
    name: Client TypeScript + Expo checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx expo-doctor
      - name: iOS JavaScript export
        run: npx expo export --platform ios --output-dir /tmp/empath-ios-ci
      - name: Production dependency audit (informational until Phase 1 completes)
        run: npm audit --omit=dev || true
